# DART run manager for noctalia v5 (Luau plugin).
# Bar widget: dart logo + running-run count; click opens the run-list panel.
# Panel: active runs with state/tags, expandable description, and
# cancel/suspend/resume/delete actions (two-step confirm on destructive ones).
# A singleton [[service]] owns all `dart run filter` polling and publishes the
# parsed run list over noctalia.state; widget and panel just watch and render.
id = "dani/dart"
name = "DART Runs"
version = "0.1.0"
# plugin_api is a compatibility window, not a feature list: noctalia loads a
# plugin only while its declared version sits inside [oldest, current] — 3..28
# as of noctalia 2026-08-19. The Luau binding layer never sees this number, so
# every call this plugin already makes was legal at 3; raising it widens which
# plugin.toml keys are accepted and opts into the >=17 service lifecycle, where
# noctalia calls onEnable() on the service and onExit()'s reason argument
# reports "disable"/"uninstall" instead of always "reload". Neither handler is
# defined here and a call to a missing global is a no-op, so the bump is inert
# today — it is here so new manifest keys need no second bump.
# CAVEAT: 28 landed upstream 2026-08-18. Rolling back to a generation with a
# noctalia older than that makes it refuse to load this plugin outright.
plugin_api = 28
author = "dani"
license = "MIT"
icon = "target-arrow" # catalog glyph only; the bar shows assets/dart-logo.png
description = "DART training runs: badge in the bar, run list with actions in a panel."

[[setting]]
key = "dart_path"
type = "string"
label_key = "settings.dart_path.label"
description_key = "settings.dart_path.description"
default = "/home/dani/Projects/sai/.venv/bin/dart"

[[setting]]
key = "nu_path"
type = "string"
label_key = "settings.nu_path.label"
description_key = "settings.nu_path.description"
# Profile symlink, not a store path: survives rebuilds and GC.
default = "/etc/profiles/per-user/dani/bin/nu"
advanced = true

[[setting]]
key = "username"
type = "string"
label_key = "settings.username.label"
description_key = "settings.username.description"
default = "daniel.hernandez"

[[setting]]
key = "limit"
type = "int"
label_key = "settings.limit.label"
description_key = "settings.limit.description"
default = 100
min = 1
max = 500

[[setting]]
key = "poll_seconds"
type = "int"
label_key = "settings.poll_seconds.label"
description_key = "settings.poll_seconds.description"
default = 120
min = 15
max = 3600

[[setting]]
key = "notify_transitions"
type = "bool"
label_key = "settings.notify_transitions.label"
description_key = "settings.notify_transitions.description"
default = true

[[widget]]
id = "widget"
entry = "widget.luau"

[[panel]]
id = "panel"
entry = "panel.luau"
width = 1200
height = 640
placement = "floating" # centered dropdown under the top bar
position = "top_center"

[[service]]
id = "poller"
entry = "service.luau"
