# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#                              TMUX CONFIGURATION
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# UI Layout {{{
set -as terminal-features '*:RGB'

# Claude Code clamps itself to 256 colors whenever $TMUX is set (it doesn't
# trust tmux with truecolor), which re-quantizes the statusline's RGB ember
# palette to duller xterm-256 approximations. This env var is its documented
# opt-out; safe here because '*:RGB' above makes the tmux→terminal chain
# genuinely truecolor.
set-environment -g CLAUDE_CODE_TMUX_TRUECOLOR 1

# Pass extended keys (kitty keyboard protocol) through to apps like nvim.
# Without this tmux collapses Ctrl+Shift+<key> to Ctrl+<key>, so e.g. nvim
# can't tell <C-S-j> from <C-j>. Needed for FloatTerm's <C-S-j>/<C-S-k>.
# `on` (not `always`): nvim requests extended keys on startup and tmux honours
# it, so <C-S-j> still works — and snacks.image's terminal-name query
# leak-suppression only engages on `on`, not `always` (folke/snacks.nvim#2332).
set -s extended-keys on
set -s extended-keys-format csi-u
set -as terminal-features '*:extkeys'

# Clickable OSC-8 hyperlinks (ls --hyperlink, delta, etc.) pass through tmux
set -as terminal-features '*:hyperlinks'

# To allow for base16 colors to propagate (this is needed from version 3.3 onwards)
set -g allow-passthrough on

# Takes environment from the parent shell (the shell that calls `tmux`)
set -ga update-environment EDITOR
# NB: never sync TERM from the attaching client — inside tmux, TERM must always be
# the default-terminal (tmux-256color). Syncing plants e.g. TERM=kitty in the
# session env, which leaks into panes and breaks nvim rendering.
set -ga update-environment TERM_PROGRAM

# Statusline options
set-option -g status-position top
set -g status-style "bg=default"
set -g status-justify left

set -g renumber-windows on
set -g status-keys vi
set -g status-interval 15

# Window's name changes according to the process being run on them
set -g automatic-rename on
set-option -g automatic-rename-format "#{b:pane_current_path}: #{pane_current_command}"

# look for other sessions when exiting last pane of session
set-option -g detach-on-destroy off

# Pane borders — the focused pane glows coral, the rest recede into graphite
set -g pane-active-border-style "fg=#{@color_ember}"
set -g pane-border-style "fg=#{@color_bg2}"
set -g pane-border-lines single

# Message and command-prompt styling.
# `fill` is load-bearing: the prompt is drawn *on top of* the status line, and
# only the fill attribute clears the bar behind it. tmux's own defaults carry
# one (fill=yellow); overriding message-style without one leaves the prompt
# chewing through the status bar a character at a time as you type.
set -g message-style "fg=#{@color_yellow},bg=#{@color_bg1},fill=#{@color_bg1},bold"
# vi normal mode inside the prompt — coral text marks the mode change
set -g message-command-style "fg=#{@color_ember},bg=#{@color_bg1},fill=#{@color_bg1},bold"

# Mode styling (copy mode, etc.)
set -g mode-style "fg=#{@color_bg0},bg=#{@color_ember},bold"

# Popup styling (display-popup, floax) — warm rounded borders
set -g popup-border-lines rounded
set -g popup-border-style "fg=#{@color_ember}"
set -g popup-style "bg=default"

# Menu styling (display-menu) — coral selection on ashen border
set -g menu-border-lines rounded
set -g menu-border-style "fg=#{@color_bg3}"
set -g menu-style "fg=#{@color_fg1},bg=#{@color_bg1}"
set -g menu-selected-style "fg=#{@color_bg0},bg=#{@color_ember},bold"

# Command-prompt cursor matches the theme (tmux >= 3.5)
set -g prompt-cursor-colour "#e08060"  # coral (colour options can't reference @vars)

# Scrollbar only while in copy mode / view mode (tmux >= 3.6) — handy with mouse on
set -g pane-scrollbars modal
set -g pane-scrollbars-style "fg=#{@color_ember_dim},bg=#{@color_bg1},width=1"

# Grace period before the first repeat of a -r binding counts (tmux >= 3.6);
# avoids H/L window-switch repeats swallowing an immediately-typed h/j/k/l
set -g initial-repeat-time 300

set -g display-time 2000
# Small nonzero value: 0 makes tmux misread a lone Esc in escape sequences over ssh
set -g escape-time 10

# Forward terminal focus events so nvim gets FocusGained/FocusLost (autoread, gitsigns)
set -g focus-events on
# OSC-52: copy-mode yanks land in the system clipboard, even over ssh
set -g set-clipboard on
# Default scrollback is a measly 2000 lines
set -g history-limit 50000
# }}}
# Colorscheme and status-line {{{

# @color_* variables are GENERATED from ../palette.nix and prepended to this
# file by default.nix — one source of truth shared with starship, kitty,
# ghostty and the rest of the system. Edit palette.nix, not hex codes here.

# ┌─────────────────────────────────────────────────────────────────────────────┐
# │ Ember status bar — everything is a slab that heats up left-to-right along    │
# │ ash → ember_dim → ember → ember_hot. The session and the clock bookend the   │
# │ bar at full coral; the active window is the third hot spot. Everything else  │
# │ sits on graphite so the orange stays the thing your eye lands on.            │
# │                                                                              │
# │ Style directives are deliberately split one attribute per #[] (#[fg=…]#[bg=…]│
# │ rather than #[fg=…,bg=…]) because a comma inside #{?cond,a,b} terminates the │
# │ conditional's branch — the prefix-highlight below depends on this.           │
# └─────────────────────────────────────────────────────────────────────────────┘

## WINDOWS — pills on the transparent bar, one space apart
set -g window-status-separator " "

# Auto-named windows read "<dir>: <program>" (see automatic-rename-format above);
# the formats below rebuild that pair inline so the directory can be bold and the
# program plain. Manually renamed windows (automatic-rename off) fall back to #W.
# NB: option values render as 1/0, so #{?automatic-rename,…} is the right test —
# #{==:#{automatic-rename},on} never matches.
#
# Inactive — graphite pill with rounded caps; only the index carries a coral tint
set -g window-status-format "#[bg=default]#{?window_zoomed_flag,#[fg=#{@color_yellow}],#[fg=#{@color_bg1}]}#{?window_zoomed_flag,#[bg=#{@color_yellow}],#[bg=#{@color_bg1}]}#{?window_zoomed_flag,#[fg=#{@color_bg0}]#[bold],#{?window_activity_flag,#[fg=#{@color_yellow}],#[fg=#{@color_ember_dim}]}} #{?window_last_flag,󰁯 ,}#{?window_zoomed_flag,󰊓 ,}#I #[nobold]#{?window_zoomed_flag,#[fg=#{@color_yellow}]#[bg=#{@color_bg1}],}#[bg=#{@color_bg1}]#[fg=#{@color_fg1}]#{?automatic-rename,#[bold]#{b:pane_current_path}#[nobold]: #{pane_current_command},#W} #[fg=#{@color_bg1}]#[bg=default]"

# Active — a two-stage ember gradient: banked coral on the index, full coral on the name
set -g window-status-current-format "#[bg=default]#{?window_zoomed_flag,#[fg=#{@color_yellow}],#[fg=#{@color_ember_dim}]}#{?window_zoomed_flag,#[bg=#{@color_yellow}],#[bg=#{@color_ember_dim}]}#[fg=#{@color_bg0}]#[bold] #{?window_zoomed_flag,󰊓 ,}#I #[nobold]#{?window_zoomed_flag,#[fg=#{@color_yellow}],#[fg=#{@color_ember_dim}]}#[bg=#{@color_ember}]#[fg=#{@color_bg0}]#[bold] #{?automatic-rename,#{b:pane_current_path}#[nobold]: #{pane_current_command},#W} #[nobold]#[fg=#{@color_ember}]#[bg=default]"

## STATUS LEFT / RIGHT
set -g status-left-length 60
set -g status-right-length 150

# Left — session name on solid coral with a three-step flame trail tapering out.
# Holding the prefix blazes the whole slab (#ff8f66) and swaps the flame for a bolt.
set -g status-left "#[bg=default]#{?client_prefix,#[fg=#{@color_yellow}],#[fg=#{@color_ember}]}#{?client_prefix,#[bg=#{@color_yellow}],#[bg=#{@color_ember}]}#[fg=#{@color_bg0}]#[bold]󰈸 #S #[nobold]#{?client_prefix,#[fg=#{@color_yellow}],#[fg=#{@color_ember}]}#[bg=#{@color_ember_dim}]#[fg=#{@color_ember_dim}]#[bg=#{@color_ash}]#[fg=#{@color_ash}]#[bg=default] #{?pane_in_mode,#[fg=#{@color_yellow}]#[bg=#{@color_yellow}]#[fg=#{@color_bg0}]#[bold]󰆏 COPY#[nobold]#[bg=default]#[fg=#{@color_yellow}] ,}"

# Right — one continuous graphite strip, thin dividers between readouts, then the
# ash→ember ramp into the clock. Same readouts as before, just welded together.
set -g status-right ""

# Leading edge of the strip
set -ga status-right "#[bg=default]#[fg=#{@color_bg1}]#[bg=#{@color_bg1}]"

# Git branch (if in a git repo)
set -ga status-right "#[fg=#{@color_ember}] 󰊢 #[fg=#{@color_fg1}]#(cd #{pane_current_path}; git rev-parse --abbrev-ref HEAD 2>/dev/null || echo '–') "

# RAM usage
set -ga status-right "#[fg=#{@color_bg3}]#[fg=#{@color_green}] 󰍛 #[fg=#{@color_fg1}]#(free -m | awk '/Mem:/ {printf(\"%.1fG\", \$3/1024)}') "

# Clock — the hot end of the ramp, capped round
set -ga status-right "#[fg=#{@color_bg1}]#[bg=#{@color_ash}]#[fg=#{@color_ash}]#[bg=#{@color_ember_dim}]#[fg=#{@color_ember_dim}]#[bg=#{@color_ember}]#[fg=#{@color_bg0}]#[bold] 󰥔 %H:%M #[nobold]#[fg=#{@color_ember}]#[bg=default]"

# }}}
# Bindings {{{

# Splits inherit the pane's directory, same as `c` further down
bind-key v split-window -h -c "#{pane_current_path}"
bind-key b split-window -c "#{pane_current_path}"

bind r source-file ~/.config/tmux/tmux.conf \; display-message "Tmux config reloaded!"

# Make copy mode behave like vim
set -g mode-keys vi
# The -T ensures this binding only happens on table copy-mode-vi

bind-key -T copy-mode-vi Escape send -X cancel
bind-key -T copy-mode-vi 'C-v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection-and-cancel
bind-key -T copy-mode-vi 'v' send -X begin-selection \; send -X rectangle-toggle

# Switch to last active window
bind-key C-b last-window
# Switch to last active pane
bind C-a last-pane

# Use Alt + arrow (or vi bindings) keys to switch panes
# REMINDER: -n flag means "no prefix"
# -n: no prefix
# -r: repeatable
bind -n M-h select-pane -L
bind -n M-l select-pane -R
bind -n M-k select-pane -U
bind -n M-j select-pane -D

# Alt+Shift moves the pane itself, one step per press. Focus follows the
# swap (no -d), so repeated presses walk the pane across the window.
bind -n M-H swap-pane -s "{left-of}"
bind -n M-L swap-pane -s "{right-of}"
bind -n M-K swap-pane -s "{up-of}"
bind -n M-J swap-pane -s "{down-of}"

bind -n C-M-h resize-pane -L
bind -n C-M-l resize-pane -R
bind -n C-M-k resize-pane -U
bind -n C-M-j resize-pane -D

# bind HL to window traversal
bind -r H previous-window
bind -r L next-window

# New windows and panes start in the current directory
bind c new-window -c "#{pane_current_path}"

# Zoxide sessionizer: pick a frecent dir in a popup, then jump to (or create)
# a session rooted there. Session name = dir basename ('.' -> '_', tmux
# forbids dots); '=' prefix makes the -t match exact instead of prefix.
# (\$ keeps tmux from expanding the shell vars at config-parse time)
bind C-j display-popup -E -w 70% -h 60% "dir=\"$(zoxide query -i)\" && name=\"$(basename \"\$dir\" | tr '.' '_')\" && (tmux has-session -t \"=\$name\" 2>/dev/null || tmux new-session -d -s \"\$name\" -c \"\$dir\") && tmux switch-client -t \"=\$name\""

# Temporary tools in floating popups (vanish on exit, don't pollute the tab bar)
bind R display-popup -E -w 90% -h 90% -d "#{pane_current_path}" serpl
bind t display-popup -E -w 90% -h 90% btop
# }}}
# Miscelaneous {{{
# Don't ring any bells. And don't take over the status bar for a measly notification
set -g visual-activity off
set -g visual-bell off
# monitored, not announced: the only signal is the gold window index.
# tmux's default for both alert styles is `reverse`, which inverts the whole
# flagged pill — rounded caps included, whose trick is fg-on-transparent —
# and shears the bubble open. `none` leaves the pill to the formats above.
set -g monitor-activity on
set -g window-status-activity-style none
set -g window-status-bell-style none
set -g bell-action none

# Allows to use the mouse for various actions such as scrolling or changing active pane.
set -g mouse on

# Start windows and panes index at 1, not 0
set -g base-index 1
set -g pane-base-index 1

# Rather than constraining window size to the maximum size of any client
# connected to the *session*, constrain window size to the maximum size of any
# client connected to *that window*. Much more reasonable.
set -g aggressive-resize on
# }}}
