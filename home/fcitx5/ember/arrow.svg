<!-- Submenu arrow, rasterised to arrow.png (6x12) by package.nix. Coral core,
     near-black outline: classicui has no highlighted variant, so the one image
     must read on the dark menu row and on the coral selected plate. -->
<svg xmlns="http://www.w3.org/2000/svg" width="6" height="12" viewBox="0 0 6 12">
  <!-- Pushed to the edges of the box, stroke 0.7: thicker eats the coral core,
       thinner loses the outline to antialiasing on the coral plate. -->
  <path d="M 0.9 1.8 L 5.2 6 L 0.9 10.2 Z"
        fill="@accent@"
        stroke="@bgDeep@"
        stroke-width="0.7"
        stroke-linejoin="round"/>
</svg>
