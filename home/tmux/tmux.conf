# UI Layout {{{
set -as terminal-features '*:RGB'

# Claude Code drops to 256 colours whenever $TMUX is set; this is its
# documented opt-out, safe because '*:RGB' above keeps the chain truecolor.
set-environment -g CLAUDE_CODE_TMUX_TRUECOLOR 1

# Extended keys (kitty protocol), so nvim can tell <C-S-j> from <C-j>. `on`,
# not `always`: nvim requests them itself, and snacks.image's query-leak
# suppression only engages on `on` (folke/snacks.nvim#2332).
set -s extended-keys on
set -s extended-keys-format csi-u
set -as terminal-features '*:extkeys'

# Clickable OSC-8 hyperlinks (ls --hyperlink, delta, etc.) pass through tmux
set -as terminal-features '*:hyperlinks'

# danvim's snacks.image sends its kitty-graphics escapes through this
set -g allow-passthrough on

# Takes environment from the parent shell (the shell that calls `tmux`)
set -ga update-environment EDITOR
# Never add TERM here: panes must keep tmux-256color, and a synced TERM=kitty
# leaks into them and breaks nvim rendering.
set -ga update-environment TERM_PROGRAM

# Statusline options
set-option -g status-position top
set -g status-style "bg=default"
set -g status-justify left

set -g renumber-windows on
set -g status-interval 15

# Window's name changes according to the process being run on them
set -g automatic-rename on
set-option -g automatic-rename-format "#{b:pane_current_path}: #{pane_current_command}"

# look for other sessions when exiting last pane of session
set-option -g detach-on-destroy off

# Pane borders — the focused pane glows coral, the rest recede into graphite
set -g pane-active-border-style "fg=#{@accent}"
set -g pane-border-style "fg=#{@border}"
set -g pane-border-lines single

# Message and command-prompt styling. `fill` is load-bearing: the prompt is
# drawn over the status line and only fill clears it (tmux's default carries
# fill=yellow); without one, typing chews through the bar.
set -g message-style "fg=#{@gold},bg=#{@surface},fill=#{@surface},bold"
# vi normal mode inside the prompt — coral text marks the mode change
set -g message-command-style "fg=#{@accent},bg=#{@surface},fill=#{@surface},bold"

# Mode styling (copy mode, etc.)
set -g mode-style "fg=#{@bg},bg=#{@accent},bold"

# Popup styling (floax passes its own colours, see default.nix)
set -g popup-border-lines rounded
set -g popup-border-style "fg=#{@accent}"
set -g popup-style "bg=default"

# Menu styling (display-menu) — coral selection on ashen border
set -g menu-border-lines rounded
set -g menu-border-style "fg=#{@divider}"
set -g menu-style "fg=#{@fgSoft},bg=#{@surface}"
set -g menu-selected-style "fg=#{@bg},bg=#{@accent},bold"

# Scrollbar only while in copy mode / view mode (tmux >= 3.6) — handy with mouse on
set -g pane-scrollbars modal
set -g pane-scrollbars-style "fg=#{@accentDim},bg=#{@surface},width=1"

# Grace period before the first repeat of a -r binding counts (tmux >= 3.6);
# avoids H/L window-switch repeats swallowing an immediately-typed h/j/k/l
set -g initial-repeat-time 300

set -g display-time 2000

# OSC-52: copy-mode yanks land in the system clipboard, even over ssh
set -g set-clipboard on
# }}}
# Colorscheme and status-line {{{

# The #{@<slot>} options come from ../../palette/ via default.nix: edit the palette,
# not hex here.

# Slabs heat up ash → accentDim → accent; session and clock bookend the bar in
# full coral. Style directives are split one attribute per #[] (#[fg=…]#[bg=…],
# not #[fg=…,bg=…]): a comma inside #{?cond,a,b} would end the branch.

## WINDOWS — pills on the transparent bar, one space apart
set -g window-status-separator " "

# Auto-named windows rebuild "<dir>: <program>" inline to bold the dir; renamed
# ones fall back to #W. Test #{?automatic-rename,…}: option values render as
# 1/0, so #{==:#{automatic-rename},on} never matches.
#
# Inactive — graphite pill with rounded caps; only the index carries a coral tint
set -g window-status-format "#[bg=default]#{?window_zoomed_flag,#[fg=#{@gold}],#[fg=#{@surface}]}#{?window_zoomed_flag,#[bg=#{@gold}],#[bg=#{@surface}]}#{?window_zoomed_flag,#[fg=#{@bg}]#[bold],#{?window_activity_flag,#[fg=#{@gold}],#[fg=#{@accentDim}]}} #{?window_last_flag,󰁯 ,}#{?window_zoomed_flag,󰊓 ,}#I #[nobold]#{?window_zoomed_flag,#[fg=#{@gold}]#[bg=#{@surface}],}#[bg=#{@surface}]#[fg=#{@fgSoft}]#{?automatic-rename,#[bold]#{b:pane_current_path}#[nobold]: #{pane_current_command},#W} #[fg=#{@surface}]#[bg=default]"

# Active — a two-stage accent gradient: banked coral on the index, full coral on the name
set -g window-status-current-format "#[bg=default]#{?window_zoomed_flag,#[fg=#{@gold}],#[fg=#{@accentDim}]}#{?window_zoomed_flag,#[bg=#{@gold}],#[bg=#{@accentDim}]}#[fg=#{@bg}]#[bold] #{?window_zoomed_flag,󰊓 ,}#I #[nobold]#{?window_zoomed_flag,#[fg=#{@gold}],#[fg=#{@accentDim}]}#[bg=#{@accent}]#[fg=#{@bg}]#[bold] #{?automatic-rename,#{b:pane_current_path}#[nobold]: #{pane_current_command},#W} #[nobold]#[fg=#{@accent}]#[bg=default]"

## STATUS LEFT / RIGHT
set -g status-left-length 60
set -g status-right-length 150

# Left — session name on solid coral with a three-step flame trail; holding the
# prefix turns the slab gold.
set -g status-left "#[bg=default]#{?client_prefix,#[fg=#{@gold}],#[fg=#{@accent}]}#{?client_prefix,#[bg=#{@gold}],#[bg=#{@accent}]}#[fg=#{@bg}]#[bold]󰈸 #S #[nobold]#{?client_prefix,#[fg=#{@gold}],#[fg=#{@accent}]}#[bg=#{@accentDim}]#[fg=#{@accentDim}]#[bg=#{@ash}]#[fg=#{@ash}]#[bg=default] #{?pane_in_mode,#[fg=#{@gold}]#[bg=#{@gold}]#[fg=#{@bg}]#[bold]󰆏 COPY#[nobold]#[bg=default]#[fg=#{@gold}] ,}"

# Not #() jobs, which re-run on every redraw in a new second (i.e. constantly
# while typing): status-daemon.nu writes these instead, @st_git per session,
# so `show -g @st_git` only ever shows this seed. The en dash shows until the
# daemon's first write, which waits for an attached client.
set -g @st_git "–"
set -g @st_ram "–"

# Right — one graphite strip of readouts, then the ash→accent ramp into the clock
set -g status-right ""

# Leading edge of the strip
set -ga status-right "#[bg=default]#[fg=#{@surface}]#[bg=#{@surface}]"

# Git branch (if in a git repo)
set -ga status-right "#[fg=#{@accent}] 󰊢 #[fg=#{@fgSoft}]#{@st_git} "

# RAM usage
set -ga status-right "#[fg=#{@divider}]#[fg=#{@olive}] 󰍛 #[fg=#{@fgSoft}]#{@st_ram} "

# Clock — the hot end of the ramp, capped round
set -ga status-right "#[fg=#{@surface}]#[bg=#{@ash}]#[fg=#{@ash}]#[bg=#{@accentDim}]#[fg=#{@accentDim}]#[bg=#{@accent}]#[fg=#{@bg}]#[bold] 󰥔 %H:%M #[nobold]#[fg=#{@accent}]#[bg=default]"

# }}}
# Bindings {{{

# Splits inherit the pane's directory, same as `c` further down
bind-key v split-window -h -c "#{pane_current_path}"
bind-key b split-window -c "#{pane_current_path}"

bind r source-file ~/.config/tmux/tmux.conf \; display-message "Tmux config reloaded!"

# Copy mode like vim (mode-keys vi comes from keyMode in default.nix): v selects
# by character, C-v by block

bind-key -T copy-mode-vi Escape send -X cancel
bind-key -T copy-mode-vi 'C-v' send -X rectangle-on \; send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection-and-cancel
bind-key -T copy-mode-vi 'v' send -X rectangle-off \; send -X begin-selection

# Switch to last active window
bind-key C-b last-window
# Switch to last active pane
bind C-a last-pane

# Alt+h/j/k/l switch panes (-n: no prefix; -r below: repeatable)
bind -n M-h select-pane -L
bind -n M-l select-pane -R
bind -n M-k select-pane -U
bind -n M-j select-pane -D

# Alt+Shift moves the pane itself, one step per press. Focus follows the
# swap (no -d), so repeated presses walk the pane across the window.
bind -n M-H swap-pane -s "{left-of}"
bind -n M-L swap-pane -s "{right-of}"
bind -n M-K swap-pane -s "{up-of}"
bind -n M-J swap-pane -s "{down-of}"

bind -n C-M-h resize-pane -L
bind -n C-M-l resize-pane -R
bind -n C-M-k resize-pane -U
bind -n C-M-j resize-pane -D

# bind HL to window traversal
bind -r H previous-window
bind -r L next-window

# New windows and panes start in the current directory
bind c new-window -c "#{pane_current_path}"

# Zoxide sessionizer: pick a frecent dir, then switch to (or create) a session
# named after its basename ('.' -> '_', tmux forbids dots; '=' makes -t exact).
# \$ keeps tmux from expanding the shell vars at config-parse time.
bind C-j display-popup -E -w 70% -h 60% "dir=\"$(zoxide query -i)\" && name=\"$(basename \"\$dir\" | tr '.' '_')\" && (tmux has-session -t \"=\$name\" 2>/dev/null || tmux new-session -d -s \"\$name\" -c \"\$dir\") && tmux switch-client -t \"=\$name\""

# Temporary tools in floating popups (vanish on exit, don't pollute the tab bar)
bind R display-popup -E -w 90% -h 90% -d "#{pane_current_path}" serpl
bind t display-popup -E -w 90% -h 90% btop
# }}}
# Miscelaneous {{{
# No bells, and no status-bar takeover for notifications
set -g visual-activity off
set -g visual-bell off
# Monitored, not announced: the gold window index is the only signal. `none`,
# because the default `reverse` inverts the whole pill and breaks its round caps.
set -g monitor-activity on
set -g window-status-activity-style none
set -g window-status-bell-style none
set -g bell-action none
# }}}
