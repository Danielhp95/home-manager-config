# DART run manager: bar badge, run-list panel with actions, and a singleton
# service that owns all polling (README.md).
id = "dani/dart"
name = "DART Runs"
version = "0.1.0"
# noctalia loads a plugin only while plugin_api is inside its supported range
# (3..32 in 5.2.0). The code needs 28 (panel.openContextMenu; also 9 closure
# props, 19 formatTime UTC, 22 require, 24 argv runAsync).
plugin_api = 30
author = "dani"
license = "MIT"
icon = "target-arrow" # catalog glyph only; the bar shows assets/dart-logo.png
description = "DART training runs: badge in the bar, run list with actions in a panel."

[[setting]]
key = "dart_path"
type = "string"
label_key = "settings.dart_path.label"
description_key = "settings.dart_path.description"
default = "/home/dani/Projects/sai/.venv/bin/dart"

[[setting]]
key = "nu_path"
type = "string"
label_key = "settings.nu_path.label"
description_key = "settings.nu_path.description"
# Profile symlink, not a store path: survives rebuilds and GC.
default = "/etc/profiles/per-user/dani/bin/nu"
advanced = true

[[setting]]
key = "username"
type = "string"
label_key = "settings.username.label"
description_key = "settings.username.description"
default = "daniel.hernandez"

[[setting]]
key = "limit"
type = "int"
label_key = "settings.limit.label"
description_key = "settings.limit.description"
default = 100
min = 1
max = 500

[[setting]]
key = "poll_seconds"
type = "int"
label_key = "settings.poll_seconds.label"
description_key = "settings.poll_seconds.description"
default = 120
min = 15
max = 3600

[[setting]]
key = "notify_transitions"
type = "bool"
label_key = "settings.notify_transitions.label"
description_key = "settings.notify_transitions.description"
default = true

[[widget]]
id = "widget"
entry = "widget.luau"

[[panel]]
id = "panel"
entry = "panel.luau"
width = 1200
height = 640
placement = "floating" # centered dropdown under the top bar
position = "top_center"

[[service]]
id = "poller"
entry = "service.luau"
