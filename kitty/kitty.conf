# vim:fileencoding=utf-8:ft=conf:foldmethod=marker
# Rest time before the trail follows; raising it makes typing bursts trail.
cursor_trail 4
cursor_trail_decay 0.5 0.1
# Trail only on jumps over 40 columns or 5 rows, not while typing.
cursor_trail_start_threshold 40 5
custom_shaders ember-blaze

#: Fonts {{{

# font_family comes from ../fonts.nix via kitty/default.nix.

adjust_line_height  117%
adjust_column_width 0

# Every Nerd Font icon from Symbols Nerd Font Mono: kitty has no bundled icon
# fallback, so glyphs JetBrainsMono lacks would render as tofu.
symbol_map U+23FB-U+23FE,U+2665,U+26A1,U+2B58 Symbols Nerd Font Mono
symbol_map U+E000-U+E00A,U+E0A0-U+E0A3,U+E0B0-U+E0D7 Symbols Nerd Font Mono
symbol_map U+E200-U+E2A9,U+E300-U+E3E3,U+E5FA-U+E6B7 Symbols Nerd Font Mono
symbol_map U+E700-U+E8EF,U+EA60-U+EC1E,U+ED00-U+EFCE Symbols Nerd Font Mono
symbol_map U+F000-U+F2FF,U+F300-U+F381,U+F400-U+F533 Symbols Nerd Font Mono
symbol_map U+F0001-U+F1AF0 Symbols Nerd Font Mono

# Media-control symbols (⏵ ⏸ …, Claude Code's mode indicators) aren't Nerd
# Font glyphs: Noto Sans Symbols 2 covers them except U+23EB/U+23EC (Unifont).
# U+23F0-U+23F3 stay emoji. Check with: fc-list ':charset=23F8' family
symbol_map U+23E9-U+23EA,U+23ED-U+23EF,U+23F4-U+23FA Noto Sans Symbols 2
symbol_map U+23EB-U+23EC Unifont
# U+2702 ✂: in neither Nerd Font, and the fontconfig fallback drew it blank.
symbol_map U+2702 Noto Sans Symbols 2

box_drawing_scale 0.001, 1, 1.5, 2

#: }}}

#: Cursor customization {{{

cursor_shape block
shell_integration enabled no-cursor

cursor_blink_interval      0.5
cursor_stop_blinking_after 15.0

#: }}}

#: Scrollback {{{

scrollback_lines 2000

scrollback_pager less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER

scrollback_pager_history_size 0

wheel_scroll_multiplier 5.0

touch_scroll_multiplier 1.0

#: }}}

#: Mouse {{{

# url_color comes from ../palette.nix via kitty/default.nix.
url_style curly

open_url_with default

copy_on_select no

select_by_word_characters :@-./_~?&=%+#

click_interval -1.0

mouse_hide_wait 3.0

focus_follows_mouse no

#: }}}

#: Performance tuning {{{

repaint_delay 10

input_delay 3

# Off: under tmux a redraw arrives as one burst, and a burst that just misses a
# vblank waits a whole frame (16.7ms at 60Hz) on a ~29ms Enter round trip.
# The cost is tearing while scrolling; set it back to `yes` if that shows.
sync_to_monitor no

#: }}}

#: Terminal bell {{{

enable_audio_bell no

visual_bell_duration 0.0

window_alert_on_bell no

bell_on_tab no

#: }}}

#: Window layout {{{

remember_window_size  yes
initial_window_width  640
initial_window_height 400

enabled_layouts *

window_resize_step_cells 2
window_resize_step_lines 2

window_border_width 1.0

draw_minimal_borders yes

window_margin_width 0.0

single_window_margin_width -1000.0

# Horizontal padding: the prompt's round pill caps need air from the edge.
window_padding_width 0 8

# active_border_color and bell_border_color: palette.nix via kitty/default.nix.

inactive_border_color #3c3b39

inactive_text_alpha 1.0

hide_window_decorations no

#: }}}

#: Tab bar {{{

tab_bar_edge bottom

tab_bar_margin_width 0.0

tab_bar_style fade

tab_fade 0.25 0.5 0.75 1

tab_separator " ┇"

tab_title_template {title}

active_tab_foreground   #000
active_tab_background   #eee
active_tab_font_style   bold-italic
inactive_tab_foreground #444
inactive_tab_background #999
inactive_tab_font_style normal

#: }}}

background_opacity         0.87
dynamic_background_opacity yes

dim_opacity 1.0

# The Ember colours (color0-15, background, cursor…): kitty/default.nix.

#: }}}

#: Advanced {{{

shell .

editor .

close_on_child_death no

allow_remote_control no

startup_session none

clipboard_control write-clipboard write-primary

term xterm-kitty

#: }}}

#: OS specific tweaks {{{

macos_titlebar_color system

macos_option_as_alt yes

macos_hide_from_tasks no

macos_quit_when_last_window_closed no

macos_window_resizable yes

macos_thicken_font 0

macos_traditional_fullscreen no

macos_custom_beam_cursor no

#: }}}

#: Keyboard shortcuts {{{

kitty_mod ctrl+shift

clear_all_shortcuts no

#: Clipboard {{{

map kitty_mod+c copy_to_clipboard

map kitty_mod+v  paste_from_clipboard
map kitty_mod+s  paste_from_selection
map shift+insert paste_from_selection
map kitty_mod+o  pass_selection_to_program

#: }}}

#: Scrolling {{{

map kitty_mod+up        scroll_line_up
map kitty_mod+down      scroll_line_down
# ctrl+shift+j/k stay unmapped (empty action) so they reach the program:
# Neovim's floaterm uses them.
map kitty_mod+k
map kitty_mod+j
map kitty_mod+page_up   scroll_page_up
map kitty_mod+page_down scroll_page_down
map kitty_mod+home      scroll_home
map kitty_mod+end       scroll_end
map kitty_mod+h         show_scrollback

#: }}}

#: Window management {{{

map kitty_mod+enter new_window

map kitty_mod+n new_os_window
map kitty_mod+w close_window
map kitty_mod+] next_window
map kitty_mod+[ previous_window
map kitty_mod+f move_window_forward
map kitty_mod+b move_window_backward
map kitty_mod+` move_window_to_top
map kitty_mod+r start_resizing_window
map kitty_mod+1 first_window
map kitty_mod+2 second_window
map kitty_mod+3 third_window
map kitty_mod+4 fourth_window
map kitty_mod+5 fifth_window
map kitty_mod+6 sixth_window
map kitty_mod+7 seventh_window
map kitty_mod+8 eighth_window
map kitty_mod+9 ninth_window
map kitty_mod+0 tenth_window
#: }}}

#: Tab management {{{

map kitty_mod+right next_tab
map kitty_mod+left  previous_tab
map kitty_mod+t     new_tab
map kitty_mod+q     close_tab
map kitty_mod+.     move_tab_forward
map kitty_mod+,     move_tab_backward
map kitty_mod+alt+t set_tab_title

#: }}}

#: Layout management {{{

map kitty_mod+l next_layout

#: }}}

#: Font sizes {{{

map kitty_mod+equal     change_font_size all +2.0
map kitty_mod+minus     change_font_size all -2.0
map kitty_mod+backspace change_font_size all 0

#: }}}

#: Select and act on visible text {{{

# Hints: p>u/f/l/w copies a url/path/line/word; with shift, pastes it.
map kitty_mod+p>u kitten hints --type url --program @
map kitty_mod+p>shift+u kitten hints --type url --program -

map kitty_mod+p>f kitten hints --type path --program @
map kitty_mod+p>shift+f kitten hints --type path --program -

map kitty_mod+p>l kitten hints --type line --program @
map kitty_mod+p>shift+l kitten hints --type line --program -

map kitty_mod+p>w kitten hints --type word --program @
map kitty_mod+p>shift+w kitten hints --type word --program -

#: }}}

map kitty_mod+f11    toggle_fullscreen
map kitty_mod+u      kitten unicode_input
map kitty_mod+f2     edit_config_file
map kitty_mod+escape kitty_shell window

map kitty_mod+a>m    set_background_opacity +0.1
map kitty_mod+a>l    set_background_opacity -0.1
map kitty_mod+a>1    set_background_opacity 1
map kitty_mod+a>d    set_background_opacity default
map kitty_mod+delete clear_terminal reset active

#: }}}

# }}}
