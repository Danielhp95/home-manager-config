# Ember theme for fcitx5, installed as themes/Ember/theme.conf (the only name
# classicui loads). Each color is a placeholder named after its palette.nix
# attribute, filled in by package.nix.
#
# Contrast (WCAG: 4.5:1 text, 3:1 edges): fg on bg 11.2:1, fgDim on bg 5.6:1,
# bgDeep on accent 6.6:1 (selected candidate), surface on accent 5.2:1,
# accentDim on bg 4.1:1 (frame). Never put light text on the coral plate.
#
# Fonts belong to classicui.conf (fcitx5/default.nix), not the theme.

[Metadata]
Name=Ember
Version=1.1
Author=dani
Description=Warm monochrome input method theme with coral accent
ScaleWithDPI=True

[InputPanel]
NormalColor=@fg@
CandidateCommentColor=@fgDim@
# The selected candidate sits on the coral plate, so it must be dark.
HighlightCandidateColor=@bgDeep@
HighlightCandidateLabelColor=@bgDeep@
HighlightCandidateCommentColor=@surface@
# The preedit highlight has its own fg/bg pair: keep it dark-on-coral too.
HighlightColor=@bgDeep@
HighlightBackgroundColor=@accent@
Spacing=3

[InputPanel/TextMargin]
Left=10
Right=10
Top=6
Bottom=6

# accentDim, not `border` (1.4:1, invisible): the popup floats over any app
# and needs an edge that reads on light and dark backdrops.
[InputPanel/Background]
Color=@bg@
BorderColor=@accentDim@
BorderWidth=2

[InputPanel/Background/Margin]
Left=2
Right=2
Top=2
Bottom=2

# The selection plate. Its margin must match TextMargin, or the plate bleeds
# over the panel border.
[InputPanel/Highlight]
Color=@accent@

[InputPanel/Highlight/Margin]
Left=10
Right=10
Top=6
Bottom=6

[Menu]
# Without its own text colors the menu's selected row is illegible.
NormalColor=@fg@
HighlightCandidateColor=@bgDeep@
Spacing=3

[Menu/Background]
Color=@bgAlt@
BorderColor=@accentDim@
BorderWidth=2

[Menu/Background/Margin]
Left=2
Right=2
Top=2
Bottom=2

[Menu/ContentMargin]
Left=2
Right=2
Top=2
Bottom=2

[Menu/Highlight]
Color=@accent@

[Menu/Highlight/Margin]
Left=10
Right=10
Top=5
Bottom=5

# `border` would be 1.3:1 on the menu background, i.e. no separator at all.
[Menu/Separator]
Color=@muted@

[Menu/CheckBox]
Image=radio.png

[Menu/SubMenu]
Image=arrow.png

[Menu/TextMargin]
Left=10
Right=10
Top=5
Bottom=5
