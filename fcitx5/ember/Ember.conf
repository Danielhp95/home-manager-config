# Ember theme for fcitx5
# Installed by package.nix as share/fcitx5/themes/Ember/theme.conf (the only
# filename classicui looks for).
#
# Colors are the Ember palette (../../palette.nix), copied here because the
# theme is a plain ini file:
#   bgDeep  #141312   bg      #1c1b19   bgAlt   #242320
#   surface #2a2825   border  #3a342d
#   fg      #d8d0c0   fgDim   #9a9288   muted   #6e6a66
#   accent  #e08060 (coral)   accentDim #b8654c
#
# Contrast rationale (WCAG 2.1: 4.5:1 for text, 3:1 for UI boundaries):
#   fg        on bg      11.2:1   unselected candidates
#   fgDim     on bg       5.6:1   comments / secondary hints
#   bgDeep    on accent   6.6:1   selected candidate
#   surface   on accent   5.2:1   comment on the selected row (quieter, still AA)
#   accentDim on bg       4.1:1   panel frame
# The old theme painted fg (#d8d0c0) on the coral plate at 1.9:1, and the
# selected candidate's own color was coral-on-coral at 1.0:1 — literally
# invisible. The selection is now a solid coral plate with near-black text:
# the accent stays loud, the text stays readable. Never put light warm text
# on coral; the coral is a background, not a foreground, wherever it fills.
#
# Fonts are NOT theme properties — classicui.conf owns Font/MenuFont
# (fcitx5/default.nix sets both to Sans 14).

[Metadata]
Name=Ember
Version=1.1
Author=dani
Description=Warm monochrome input method theme with coral accent
ScaleWithDPI=True

[InputPanel]
# Unselected candidate text.
NormalColor=#d8d0c0
# Comment/hint next to an unselected candidate (rime's code hints).
CandidateCommentColor=#9a9288
# Selected candidate — drawn on the coral plate below, so it must be dark.
HighlightCandidateColor=#141312
# Its index label ("1.", "2.") — same weight, it is a hit target.
HighlightCandidateLabelColor=#141312
# Its comment — quieter, but still AA on coral.
HighlightCandidateCommentColor=#2a2825
# Highlighted preedit run (the segment being composed). classicui draws this
# with its own fg/bg pair rather than the candidate plate, so keep the same
# dark-on-coral pairing or the composing text becomes unreadable too.
HighlightColor=#141312
HighlightBackgroundColor=#e08060
Spacing=3

[InputPanel/TextMargin]
Left=10
Right=10
Top=6
Bottom=6

# accentDim rather than the flat `border` (#3a342d), which sits at 1.4:1 on
# the panel and effectively disappears — the popup floats over arbitrary app
# content and needs an edge that reads on both light and dark backdrops.
[InputPanel/Background]
Color=#1c1b19
BorderColor=#b8654c
BorderWidth=2

[InputPanel/Background/Margin]
Left=2
Right=2
Top=2
Bottom=2

# The selection plate. Its margin must match TextMargin above: classicui draws
# the plate at the text origin minus this margin, so anything larger bleeds
# over the panel border.
[InputPanel/Highlight]
Color=#e08060

[InputPanel/Highlight/Margin]
Left=10
Right=10
Top=6
Bottom=6

[Menu]
# The menu has its own text colors; without these it falls back to defaults
# and the selected row goes illegible again.
NormalColor=#d8d0c0
HighlightCandidateColor=#141312
Spacing=3

[Menu/Background]
Color=#242320
BorderColor=#b8654c
BorderWidth=2

[Menu/Background/Margin]
Left=2
Right=2
Top=2
Bottom=2

[Menu/ContentMargin]
Left=2
Right=2
Top=2
Bottom=2

[Menu/Highlight]
Color=#e08060

[Menu/Highlight/Margin]
Left=10
Right=10
Top=5
Bottom=5

# `border` would be 1.3:1 on the menu background, i.e. no separator at all.
[Menu/Separator]
Color=#6e6a66

[Menu/CheckBox]
Image=radio.png

[Menu/SubMenu]
Image=arrow.png

[Menu/TextMargin]
Left=10
Right=10
Top=5
Bottom=5
